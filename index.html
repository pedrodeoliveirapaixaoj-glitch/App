<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fas fa-cloud-sun"></i>
                <h1>Previsão do Tempo</h1>
            </div>
            <button id="refreshBtn" class="refresh-btn">
                <i class="fas fa-sync-alt"></i>
            </button>
        </header>

        <main class="weather-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Digite uma cidade..." />
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>

            <div class="current-weather" id="currentWeather">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>
            </div>

            <div class="forecast-container">
                <h2>Previsão 5 dias</h2>
                <div class="forecast" id="forecast"></div>
            </div>
        </main>

        <footer>
            <small>Dados fornecidos por OpenWeatherMap</small>
        </footer>
    </div>

    <script src="https://capacitor.ionicframework.com/capacitor.js"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
